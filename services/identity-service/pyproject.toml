[project]
name = "identity-service"
version = "0.1.0"
description = "NutriApp identity-service: authentication, registration, sessions, authorization."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9", # sync driver Alembic needs (migrations/env.py) — the app itself uses asyncpg only
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "redis>=5.0",
    "faststream[rabbit]>=0.5",
    "pybreaker>=1.2",
    "tenacity>=9.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "punq>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[rabbitmq]>=4.8",
    "factory_boy>=3.3",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["domain", "application", "infrastructure"]

[tool.ruff]
line-length = 100
# Pinned below the pyproject requires-python floor deliberately: this
# keeps ruff from suggesting 3.11+-only syntax (e.g. datetime.UTC) so the
# codebase stays easy to run against whatever interpreter is on hand
# locally, even though CI/production run >=3.12.
target-version = "py310"

[tool.ruff.lint]
# B008 (function call in default arg) is FastAPI's standard `Depends(...)`
# idiom, not a real bug, in route modules.
[tool.ruff.lint.per-file-ignores]
"infrastructure/http/routes/*.py" = ["B008"]
# Tests intentionally destructure full fixture-helper tuples for a
# consistent call shape even when a given test only asserts on some of
# them, and use dict(...) builders for readable overridable defaults.
"tests/*" = ["RUF059", "C408"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests"]
