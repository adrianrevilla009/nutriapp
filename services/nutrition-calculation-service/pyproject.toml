[project]
name = "nutrition-calculation-service"
version = "0.1.0"
description = "NutriApp nutrition-calculation-service: macro/micronutrient totals from diary/catalog data, and Mifflin-St Jeor-based calorie/macro target computation from profile-service metrics."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9", # sync driver Alembic needs (migrations/env.py) — the app itself uses asyncpg only
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "faststream[rabbit]>=0.5",
    "aio-pika>=9.4",
    "purgatory-circuitbreaker>=0.7",
    "setuptools>=70,<81", # purgatory-circuitbreaker's __init__.py imports pkg_resources at import time; removed in setuptools>=81
    "tenacity>=9.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "punq>=0.7",
    "shared-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis,rabbitmq]>=4.8",
    "factory_boy>=3.3",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
# NOT editable: this must resolve to a self-contained install inside
# .venv/site-packages, since the Docker runtime stage only copies .venv
# (not the packages/shared-contracts source tree) -- see
# services/nutrition-calculation-service/Dockerfile's comment. Local dev
# picks up shared-contracts changes via `uv sync` re-running, same as any
# other pinned dependency.
shared-contracts = { path = "../../packages/shared-contracts" }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["domain", "application", "infrastructure"]

[tool.mutmut]
# mutmut's own auto-guess for the source root fails in a monorepo layout
# (it looks for a single top-level package matching the repo/dir name,
# which doesn't exist here -- domain/application/infrastructure are
# siblings, not one importable package). Without this, `mutmut results`
# (run as a separate invocation from `mutmut run`, so the CLI's own
# --paths-to-mutate flag doesn't carry over) can't load its config at all.
source_paths = ["domain"]
# tests/conftest.py imports infrastructure.persistence.models
# unconditionally at module scope (needed by its testcontainers fixtures)
# -- mutmut's sandbox only copies source_paths plus tests/ by default, so
# without this the sandboxed pytest run can't even collect tests.
also_copy = ["infrastructure", "application"]
# Scoped to tests/unit deliberately: mutation testing here is about the
# domain-layer formulas (CLAUDE.md section 3's "recommended for the
# domain layer of any service whose correctness is ... sensitive"), and
# unit tests are the only ones that don't need a live Postgres/Redis via
# testcontainers -- running integration/contract tests against every
# mutant would be both unnecessary for this goal and far slower.
pytest_add_cli_args_test_selection = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
[tool.ruff.lint.per-file-ignores]
"infrastructure/http/routes/*.py" = ["B008"]
"tests/*" = ["RUF059", "C408"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests"]
