[project]
name = "bff-service"
version = "0.1.0"
description = "NutriApp bff-service: frontend response aggregation only -- orchestration, never business logic (ADR-0008). Composes one screen's response from parallel calls to diary-service and nutrition-calculation-service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "purgatory-circuitbreaker>=0.7",
    "setuptools>=70,<81", # purgatory-circuitbreaker's __init__.py imports pkg_resources at import time; removed in setuptools>=81
    "tenacity>=9.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "shared-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "factory_boy>=3.3",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
# Points at a pre-built WHEEL, not the packages/shared-contracts source
# directory -- same convention as every other service (see
# services/notification-service/pyproject.toml's identical comment): lets
# `uv sync --no-build` succeed everywhere this dependency is installed
# (CI, Dockerfile) without needing a source distribution build at sync
# time. Never checked in (dist/ is gitignored); rebuilt fresh by a
# `uv build` step immediately before every `uv sync --no-build` call.
shared-contracts = { path = "../../packages/shared-contracts/dist/shared_contracts-0.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["domain", "application", "infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
[tool.ruff.lint.per-file-ignores]
"infrastructure/http/routes/*.py" = ["B008"]
"tests/*" = ["RUF059", "C408"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests"]
