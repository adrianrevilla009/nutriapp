[project]
name = "catalog-service"
version = "0.1.0"
description = "NutriApp catalog-service: supermarket product inventory aggregation, normalization, deduplication, and full-text/faceted search."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9", # sync driver Alembic needs (migrations/env.py) — the app itself uses asyncpg only
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "faststream[rabbit]>=0.5",
    "purgatory-circuitbreaker>=0.7",
    "setuptools>=70,<81", # purgatory-circuitbreaker's __init__.py imports pkg_resources at import time; removed in setuptools>=81
    "tenacity>=9.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "punq>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis,rabbitmq]>=4.8",
    "factory_boy>=3.3",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["domain", "application", "infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
[tool.ruff.lint.per-file-ignores]
"infrastructure/http/routes/*.py" = ["B008"]
"tests/*" = ["RUF059", "C408"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests"]
