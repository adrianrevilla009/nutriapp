{{/*
Syncs catalog-service's Secrets Manager entries into a Kubernetes Secret
via External Secrets Operator (ADR-0007). Service-specific, since the
Secrets Manager paths differ per service/environment (see values-*.yaml
`secretsManager.*`). As of implementation plan Addendum 2, also syncs
the distinct, per-caller `internal-reveal-credential-food-recognition-service`
secret the internal lookup endpoint verifies incoming calls against --
same mechanism as profile-service's Addendum 2, not the generic
`internal_reveal_credential` shape identity-service uses.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: CATALOG_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: CATALOG_SERVICE_USDA_FDC_API_KEY
      remoteRef:
        key: {{ .Values.secretsManager.usdaFdcApiKey }}
    - secretKey: CATALOG_INTERNAL_LOOKUP_CREDENTIAL
      remoteRef:
        key: {{ .Values.secretsManager.internalLookupCredential }}
        property: credential
