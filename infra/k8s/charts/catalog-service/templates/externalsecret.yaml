{{/*
Syncs catalog-service's Secrets Manager entries into a Kubernetes Secret
via External Secrets Operator (ADR-0007). Service-specific, since the
Secrets Manager paths differ per service/environment (see values-*.yaml
`secretsManager.*`).
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: CATALOG_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: CATALOG_SERVICE_USDA_FDC_API_KEY
      remoteRef:
        key: {{ .Values.secretsManager.usdaFdcApiKey }}
