# Base values — environment overlays in values-{dev,staging,prod}.yaml
# override only what differs. Keys are consumed by the named templates in
# infra/k8s/charts/_lib/ — see identity-service's chart (same platform
# pattern) and that library chart's own README.md for the full
# named-template contract.

nameOverride: catalog-service
fullnameOverride: catalog-service

image:
  repository: catalog-service # replaced with the ECR URI at deploy time
  tag: "" # set to the git SHA by CI (ci-cd-conventions SKILL.md: never `latest`)
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  # Populated per environment by Terraform (catalog-service.tf) with the
  # IRSA role ARN granting access to this service's Secrets Manager
  # entries only (CLAUDE.md section 2.9, ADR-0007).
  irsaRoleArn: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

probes:
  liveness:
    path: /health/live
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health/ready
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # catalog-service's only inbound synchronous dependency today is the
  # public search/product-lookup surface, routed through Kong; no other
  # internal service calls it synchronously yet (diary-service,
  # food-recognition-service, recipe-service are documented future
  # *event* consumers per docs/events-catalog.md, not synchronous
  # callers). A bare podSelector (no namespaceSelector) scopes to the
  # same namespace, matching identity-service's convention.
  #
  # frontend's pod selector is added below alongside Kong: frontend's
  # server-side Route Handlers call this service's public search/lookup
  # surface directly — same shape as the bff-service -> diary-service /
  # nutrition-calculation-service ingress fix (STATUS.md's "RESOLVED
  # 2026-09-08" note), closing the matching gap flagged for
  # catalog-service in STATUS.md's `frontend` row. frontend's own egress
  # NetworkPolicy
  # (infra/k8s/charts/frontend/templates/networkpolicy-egress-downstream.yaml)
  # already allows this hop out; this was the missing other half.
  ingressRules:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 8000

# _db-provision-job.tpl input (platform-infra plan §9.1): creates this
# service's own logical database + role inside the shared RDS instance as
# a pre-install/pre-upgrade Helm hook, idempotent on every upgrade.
dbProvision:
  enabled: true
  image:
    repository: "" # set by Terraform: module.ecr_db_provision.repository_url
    tag: ""
  awsRegion: "us-east-1"
  rdsAdminDatabase: postgres
  urlScheme: postgresql+asyncpg # this service's driver (pyproject.toml: asyncpg)
  databaseName: catalog_service
  roleName: catalog_service
  rdsHost: "" # set by Terraform: module.rds.db_instance_address
  rdsMasterSecretArn: "" # set by Terraform: module.rds.master_user_secret_arn
  dbCredentialSecretArn: "" # set by Terraform: this service's db-credentials secret ARN
  irsaRoleArn: "" # set by Terraform: module.secrets.db_provision_irsa_role_arns["catalog-service"]

# Expressed as a proper Kubernetes EnvVar list ({name, value} pairs) --
# the format _lib's _deployment.tpl's `env: {{- toYaml .Values.env }}`
# actually requires (a flat map here renders an invalid Deployment spec
# neither `helm lint` nor `helm template` catches on its own -- STATUS.md's
# flagged bug, fixed here; see food-recognition-service/values.yaml's
# identical note for the precedent this backports).
env:
  - name: CATALOG_SERVICE_USDA_FDC_BASE_URL
    value: "https://api.nal.usda.gov/fdc/v1"

# Injects every key from templates/externalsecret.yaml's Kubernetes Secret
# (CATALOG_SERVICE_DATABASE_URL/CATALOG_SERVICE_USDA_FDC_API_KEY) as env
# vars -- previously missing entirely (STATUS.md's flagged bug), so
# DATABASE_URL never reached this container on a real deploy.
envFrom:
  - secretRef:
      name: catalog-service-secrets

# Secrets Manager entry ARNs (synced via External Secrets Operator per
# ADR-0007) — never a literal secret value in this file. Set by Terraform
# (catalog-service.tf) at deploy time.
secretsManager:
  dbCredentials: "" # set by Terraform: this service's db-credentials secret ARN (same value as dbProvision.dbCredentialSecretArn above)
  usdaFdcApiKey: "" # set by Terraform: module.secrets.usda_fdc_api_key_secret_arns["catalog-service"]
