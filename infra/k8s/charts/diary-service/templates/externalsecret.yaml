{{/*
Syncs diary-service's Secrets Manager entries into a Kubernetes Secret
via External Secrets Operator (ADR-0007). Not part of the _lib named-
template contract -- service-specific, since the Secrets Manager paths
differ per service/environment (see values-*.yaml `secretsManager.*`).
Only DB credentials here -- no JWT signing key, internal reveal
credential, or KMS key (diary-service issues no tokens, exposes no
internal non-Kong-routed endpoint, and owns no per-user encryption key,
unlike identity-service/profile-service).
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DIARY_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
