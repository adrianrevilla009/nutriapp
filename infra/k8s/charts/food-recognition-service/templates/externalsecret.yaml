{{/*
Syncs food-recognition-service's Secrets Manager entries into a
Kubernetes Secret via External Secrets Operator (ADR-0007): this
service's own db-credentials, the metered Anthropic API key
(implementation plan section 6(b)), and the narrow cross-service
credential for catalog-service's internal lookup endpoint (section 6(c)).
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: FOOD_RECOGNITION_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: FOOD_RECOGNITION_SERVICE_ANTHROPIC_API_KEY
      remoteRef:
        key: {{ .Values.secretsManager.anthropicApiKey }}
        property: api_key
    - secretKey: FOOD_RECOGNITION_SERVICE_CATALOG_LOOKUP_CREDENTIAL
      remoteRef:
        key: {{ .Values.secretsManager.catalogLookupCredential }}
        property: credential
