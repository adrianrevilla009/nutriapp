# Base values -- environment overlays in values-{dev,staging,prod}.yaml
# override only what differs. Keys are consumed by the named templates in
# infra/k8s/charts/_lib/ -- see that chart's own README.md for the full
# named-template contract. Mirrors infra/k8s/charts/notification-service/
# values.yaml's structure (per implementation plan section 3: built with
# the CORRECT env-list format and envFrom->ExternalSecret wiring from the
# start), stripped of everything specific to notification-service's own
# cross-service reveal-credential exception -- this service has no
# synchronous outbound call and no cross-service secret in this MVP.

nameOverride: activity-service
fullnameOverride: activity-service

image:
  repository: activity-service # replaced with the ECR URI at deploy time
  tag: "" # set to the git SHA by CI (ci-cd-conventions SKILL.md: never `latest`)
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  # Populated per environment by Terraform (activity-service.tf) with the
  # IRSA role ARN granting access to this service's own Secrets Manager
  # entries only.
  irsaRoleArn: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 750m
    memory: 384Mi

probes:
  liveness:
    path: /health/live
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health/ready
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # This service's only public HTTP surface is /api/v1/activity/* via
  # Kong. Bare podSelector (no namespaceSelector) scopes to the shared
  # namespace, same convention as every other service's chart.
  #
  # NOTE (same known _lib-level gap every other chart documents): _lib
  # only renders `policyTypes: [Ingress]` here -- egress (to the shared
  # RDS instance, RabbitMQ) is unrestricted by THIS policy. Unlike
  # notification-service/food-recognition-service, this service has no
  # synchronous outbound call in this MVP, so there is no separate
  # egress-restriction NetworkPolicy resource to add here.
  ingressRules:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: 8000

# _db-provision-job.tpl input (implementation plan section 7): creates
# this service's own logical database + role inside the shared RDS
# instance as a pre-install/pre-upgrade Helm hook, idempotent on every
# upgrade.
dbProvision:
  enabled: true
  image:
    repository: "" # set by Terraform: module.ecr_db_provision.repository_url
    tag: ""
  awsRegion: "us-east-1"
  rdsAdminDatabase: postgres
  urlScheme: postgresql+asyncpg # this service's driver (pyproject.toml: asyncpg)
  databaseName: activity_service
  roleName: activity_service
  rdsHost: "" # set by Terraform: module.rds.db_instance_address
  rdsMasterSecretArn: "" # set by Terraform: module.rds.master_user_secret_arn
  dbCredentialSecretArn: "" # set by Terraform: this service's db-credentials secret ARN
  irsaRoleArn: "" # set by Terraform: module.secrets.db_provision_irsa_role_arns["activity-service"]

# Expressed as a proper Kubernetes EnvVar list ({name, value} pairs) --
# the CORRECT format _lib's _deployment.tpl expects.
env:
  - name: AWS_REGION
    value: "us-east-1"
  - name: ACTIVITY_SERVICE_IDENTITY_JWKS_URL
    value: "http://identity-service:8000/.well-known/jwks.json"

# Injects every key from templates/externalsecret.yaml's Kubernetes
# Secret (ACTIVITY_SERVICE_DATABASE_URL) as env vars -- wired via envFrom.
envFrom:
  - secretRef:
      name: activity-service-secrets

# Secrets Manager entry ARNs (synced via External Secrets Operator per
# ADR-0007) -- never a literal secret value in this file. Set by
# Terraform (activity-service.tf) at deploy time.
secretsManager:
  dbCredentials: "" # set by Terraform: this service's db-credentials secret ARN (same value as dbProvision.dbCredentialSecretArn above)
