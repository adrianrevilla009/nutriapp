{{/*
Syncs activity-service's Secrets Manager entries into a Kubernetes Secret
via External Secrets Operator (ADR-0007). Only this service's own
db-credentials -- no cross-service reveal credential, no third-party API
key (implementation plan section 1: manual exercise logging only this
MVP, no synchronous inter-service call, no wearable provider adapter).
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: ACTIVITY_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
