{{/*
Syncs identity-service's Secrets Manager entries into a Kubernetes
Secret via External Secrets Operator (ADR-0007). Not part of the _lib
named-template contract — service-specific, since the Secrets Manager
paths differ per service/environment (see values-*.yaml
`secretsManager.*`).
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: IDENTITY_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: IDENTITY_JWT_PRIVATE_KEY
      remoteRef:
        key: {{ .Values.secretsManager.jwtSigningKeyPair }}
        property: private_key_pem
    - secretKey: IDENTITY_JWT_PUBLIC_KEY
      remoteRef:
        key: {{ .Values.secretsManager.jwtSigningKeyPair }}
        property: public_key_pem
    - secretKey: IDENTITY_INTERNAL_REVEAL_CREDENTIAL
      remoteRef:
        key: {{ .Values.secretsManager.internalRevealCredential }}
