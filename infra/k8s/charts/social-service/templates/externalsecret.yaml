{{/*
Syncs social-service's Secrets Manager entries into a Kubernetes Secret
via External Secrets Operator (ADR-0007): this service's own
db-credentials, plus a READ-ONLY copy of billing-service's OWN single
shared internal-reveal credential (needed to call billing-service's
internal entitlement-check endpoint) -- NOT a new per-caller secret;
billing-service's route checks against exactly one credential value, so
social-service is granted IAM read access to that same secret ARN
(social-service.tf's own comment has the full reasoning, mirroring
recipe-service.tf's identical grant).
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: SOCIAL_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: SOCIAL_SERVICE_BILLING_ENTITLEMENT_CREDENTIAL
      remoteRef:
        key: {{ .Values.secretsManager.billingEntitlementCredential }}
        property: credential
