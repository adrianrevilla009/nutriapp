replicaCount: 3

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10

pdb:
  minAvailable: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

secretsManager:
  dbCredentials: nutriapp/prod/social-service/db-credentials
  # billing-service's OWN single shared internal-reveal credential path --
  # see values-staging.yaml's identical comment.
  billingEntitlementCredential: nutriapp/prod/billing-service/internal-reveal-credential

dbProvisionJob:
  adminCredentialsSecretName: nutriapp/prod/rds/admin-credentials
  appCredentialsSecretName: nutriapp/prod/social-service/db-credentials
