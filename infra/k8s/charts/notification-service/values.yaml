# Base values -- environment overlays in values-{dev,staging,prod}.yaml
# override only what differs. Keys are consumed by the named templates in
# infra/k8s/charts/_lib/ -- see that chart's own README.md for the full
# named-template contract. Mirrors
# infra/k8s/charts/food-recognition-service/values.yaml's structure (this
# service's closest precedent: one outbound synchronous call guarded by
# its own dedicated egress NetworkPolicy) -- built with the CORRECT
# env-list format and envFrom->ExternalSecret wiring from the start
# (implementation plan section 3; the bug flagged in food-recognition-
# service's PR #12 affects the five OTHER, already-merged charts, not
# this one).

nameOverride: notification-service
fullnameOverride: notification-service

image:
  repository: notification-service # replaced with the ECR URI at deploy time
  tag: "" # set to the git SHA by CI (ci-cd-conventions SKILL.md: never `latest`)
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  # Populated per environment by Terraform (notification-service.tf) with
  # the IRSA role ARN granting access to this service's own Secrets
  # Manager entries PLUS the one narrow, human-approved exception: read
  # access to identity-service's single, shared internal-reveal
  # credential (never identity-service's db-credentials or any other
  # secret).
  irsaRoleArn: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 750m
    memory: 384Mi

probes:
  liveness:
    path: /health/live
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health/ready
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # This service's only public HTTP surface is /api/v1/notifications/*
  # via Kong. Bare podSelector (no namespaceSelector) scopes to the
  # shared namespace, same convention as every other service's chart.
  #
  # NOTE (same known _lib-level gap those charts document): _lib only
  # renders `policyTypes: [Ingress]` here -- egress (to the shared RDS
  # instance, RabbitMQ, identity-service, SES/SNS) is unrestricted by THIS
  # policy. The identity-reveal-egress restriction is a SEPARATE,
  # additional NetworkPolicy resource
  # (templates/networkpolicy-egress-identity-reveal.yaml).
  ingressRules:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: 8000

# identityRevealEgress: the narrow egress rule (this service's one
# synchronous exception, per docs/domain-glossary-and-context-map.md) --
# this service's pods may reach OTHER PODS ONLY via identity-service's
# pod selector, on its normal (single, not split) service port -- never
# lateral movement to any other in-cluster service. Also allows this
# service's own external dependencies by port (RDS/RabbitMQ) and outbound
# HTTPS to SES/SNS -- see
# templates/networkpolicy-egress-identity-reveal.yaml's header comment
# for why those are port-scoped rather than CIDR/pod-selector-scoped
# today (a documented follow-up, not a silent gap, same as every other
# service's identical precedent).
identityRevealEgress:
  enabled: true
  identityServicePodSelector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  identityServicePort: 8000
  rdsPort: 5432
  rabbitmqPort: 5672
  externalHttpsPort: 443

# _db-provision-job.tpl input (implementation plan section 7): creates
# this service's own logical database + role inside the shared RDS
# instance as a pre-install/pre-upgrade Helm hook, idempotent on every
# upgrade.
dbProvision:
  enabled: true
  image:
    repository: "" # set by Terraform: module.ecr_db_provision.repository_url
    tag: ""
  awsRegion: "us-east-1"
  rdsAdminDatabase: postgres
  urlScheme: postgresql+asyncpg # this service's driver (pyproject.toml: asyncpg)
  databaseName: notification_service
  roleName: notification_service
  rdsHost: "" # set by Terraform: module.rds.db_instance_address
  rdsMasterSecretArn: "" # set by Terraform: module.rds.master_user_secret_arn
  dbCredentialSecretArn: "" # set by Terraform: this service's db-credentials secret ARN
  irsaRoleArn: "" # set by Terraform: module.secrets.db_provision_irsa_role_arns["notification-service"]

# Expressed as a proper Kubernetes EnvVar list ({name, value} pairs) --
# the CORRECT format _lib's _deployment.tpl expects (implementation plan
# section 3's explicit acceptance criterion; see food-recognition-
# service/values.yaml's identical note on the five OTHER charts' bug,
# not repeated here).
env:
  - name: AWS_REGION
    value: "us-east-1"
  - name: NOTIFICATION_SERVICE_IDENTITY_SERVICE_BASE_URL
    value: "http://identity-service:8000"
  - name: NOTIFICATION_SERVICE_SES_FROM_ADDRESS
    value: "no-reply@nutriapp.example"
  # SES/SNS sandbox endpoints (docs/notifications.md section 5) --
  # deliberately no production SES/SNS endpoint override here yet; real
  # production access is a tracked AWS lead-time item (ADR-0011 follow-up,
  # implementation plan section 9, risk 1), not a blocker to this chart.
  - name: NOTIFICATION_SERVICE_REMINDER_SCAN_INTERVAL_SECONDS
    value: "60"

# Injects every key from templates/externalsecret.yaml's Kubernetes
# Secret (NOTIFICATION_SERVICE_DATABASE_URL/IDENTITY_REVEAL_CREDENTIAL/
# SES_BASE_URL/SNS_BASE_URL) as env vars -- wired via envFrom (the
# correct pattern; see the values.yaml note above on the five other
# charts' matching gap, not repeated here).
envFrom:
  - secretRef:
      name: notification-service-secrets

# Secrets Manager entry ARNs (synced via External Secrets Operator per
# ADR-0007) -- never a literal secret value in this file. Set by
# Terraform (notification-service.tf) at deploy time.
secretsManager:
  dbCredentials: "" # set by Terraform: this service's db-credentials secret ARN (same value as dbProvision.dbCredentialSecretArn above)
  identityRevealCredential: "" # set by Terraform: module.secrets.internal_reveal_credential_secret_arns["identity-service"]
  sesEndpoint: "" # set by Terraform: this service's own SES/SNS-endpoint-config secret ARN (sandbox base URLs, populated out-of-band)

