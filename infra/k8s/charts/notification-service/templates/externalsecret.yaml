{{/*
Syncs notification-service's Secrets Manager entries into a Kubernetes
Secret via External Secrets Operator (ADR-0007): this service's own
db-credentials, read access to identity-service's single, shared
internal-reveal credential (the one narrow, human-approved exception --
never identity-service's db-credentials or any other secret), and this
service's own SES/SNS sandbox endpoint config.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: NOTIFICATION_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: NOTIFICATION_SERVICE_IDENTITY_REVEAL_CREDENTIAL
      remoteRef:
        key: {{ .Values.secretsManager.identityRevealCredential }}
        property: credential
    - secretKey: NOTIFICATION_SERVICE_SES_BASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.sesEndpoint }}
        property: ses_base_url
    - secretKey: NOTIFICATION_SERVICE_SNS_BASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.sesEndpoint }}
        property: sns_base_url

