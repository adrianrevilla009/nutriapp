replicaCount: 3

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12

pdb:
  minAvailable: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

secretsManager:
  dbCredentials: nutriapp/prod/nutrition-calculation-service/db-credentials
  profileRevealCredential: nutriapp/prod/profile-service/internal-reveal-credential-nutrition-calculation-service

dbProvisionJob:
  adminCredentialsSecretName: nutriapp/prod/rds/admin-credentials
  appCredentialsSecretName: nutriapp/prod/nutrition-calculation-service/db-credentials
