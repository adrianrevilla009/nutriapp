{{/*
Syncs nutrition-calculation-service's Secrets Manager entries into a
Kubernetes Secret via External Secrets Operator (ADR-0007). Includes the
NEW, narrow exception secret -- profile-service's per-caller reveal-
metrics credential (implementation plan Addendum 1, security sub-addendum
requirements 1/2) -- alongside this service's own db-credentials, nothing
else of profile-service's.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: NUTRITION_CALCULATION_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: NUTRITION_CALCULATION_SERVICE_PROFILE_REVEAL_CREDENTIAL
      remoteRef:
        key: {{ .Values.secretsManager.profileRevealCredential }}
        property: credential
