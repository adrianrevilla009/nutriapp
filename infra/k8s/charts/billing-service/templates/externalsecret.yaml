{{/*
Syncs billing-service's Secrets Manager entries into a Kubernetes Secret
via External Secrets Operator (ADR-0007): this service's own db-credentials,
its Stripe secret key + webhook signing secret (real values are a tracked
lead-time item -- placeholder containers until then, same pattern as
catalog-service's USDA FDC key), and its own internal-entitlement-endpoint
credential (single shared secret, identity-service/catalog-service
precedent -- no real caller exists yet, per implementation plan section 6).
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: BILLING_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: BILLING_SERVICE_STRIPE_SECRET_KEY
      remoteRef:
        key: {{ .Values.secretsManager.stripeApiKey }}
        property: secret_key
    - secretKey: BILLING_SERVICE_STRIPE_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: {{ .Values.secretsManager.stripeWebhookSigningSecret }}
        property: signing_secret
    - secretKey: BILLING_INTERNAL_ENTITLEMENT_CREDENTIAL
      remoteRef:
        key: {{ .Values.secretsManager.internalEntitlementCredential }}
        property: credential

