{{/*
Syncs nutrition-assistant-service's Secrets Manager entries into a
Kubernetes Secret via External Secrets Operator (ADR-0007): this
service's own db-credentials, its own ANTHROPIC_API_KEY container
(implementation plan section 4/9 resolution 5 -- a SEPARATE container
from food-recognition-service's own key, never shared), plus a READ-ONLY
copy of billing-service's OWN single shared internal-reveal credential
(needed to call billing-service's internal entitlement-check endpoint) --
NOT a new per-caller secret, same pattern as every other Pro-gated
service's chart.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: NUTRITION_ASSISTANT_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: NUTRITION_ASSISTANT_SERVICE_ANTHROPIC_API_KEY
      remoteRef:
        key: {{ .Values.secretsManager.anthropicApiKey }}
        property: api_key
    - secretKey: NUTRITION_ASSISTANT_SERVICE_BILLING_ENTITLEMENT_CREDENTIAL
      remoteRef:
        key: {{ .Values.secretsManager.billingEntitlementCredential }}
        property: credential
