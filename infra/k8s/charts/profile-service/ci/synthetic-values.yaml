# infra/k8s/charts/profile-service/ci/synthetic-values.yaml
#
# Checked-in fixture used ONLY by .github/workflows/profile-service-ci.yml's
# helm-lint-and-template job to fill the fields Terraform normally injects
# at deploy time (profile-service.tf) -- ARNs/hosts/roles below are
# syntactically valid but point at nothing real. Never use these values
# outside CI. Mirrors identity-service's own synthetic-values.yaml
# fixture, added from day one here (identity-service only added this in a
# post-review addendum -- no reason to repeat that gap).

image:
  repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/nutriapp/profile-service"
  tag: "ci-fixture"

serviceAccount:
  irsaRoleArn: "arn:aws:iam::123456789012:role/nutriapp-dev-profile-service-app-secrets"

networkPolicy:
  enabled: true
  # Mirrors base values.yaml's two-entry list exactly (Helm -f overlays
  # REPLACE array values, never merge them) -- kept here too so CI's
  # `helm template` actually renders and validates the internal
  # reveal-metrics port's ingress rule (implementation plan Addendum 2).
  ingressRules:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nutrition-calculation-service
      ports:
        - protocol: TCP
          port: 8001

secretsManager:
  dbCredentials: "arn:aws:secretsmanager:us-east-1:123456789012:secret:nutriapp/dev/profile-service/db-credentials-XyZ123"
  internalRevealCredentialNutritionCalc: "arn:aws:secretsmanager:us-east-1:123456789012:secret:nutriapp/dev/profile-service/internal-reveal-credential-nutrition-calculation-service-XyZ123"

dbProvision:
  irsaRoleArn: "arn:aws:iam::123456789012:role/nutriapp-dev-profile-service-db-provision"
  rdsHost: "nutriapp-dev-postgres.abc123.us-east-1.rds.amazonaws.com"
  rdsMasterSecretArn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:rds!db-abc123"
  dbCredentialSecretArn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:nutriapp/dev/profile-service/db-credentials-XyZ123"
  image:
    repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/nutriapp/db-provision"
    tag: "ci-fixture"
