{{/*
Syncs profile-service's Secrets Manager entries into a Kubernetes Secret
via External Secrets Operator (ADR-0007). Not part of the _lib named-
template contract -- service-specific, since the Secrets Manager paths
differ per service/environment (see values-*.yaml `secretsManager.*`).
No JWT signing key (profile-service issues no tokens). As of
implementation plan Addendum 2, also syncs the distinct, per-caller
`internal-reveal-credential-nutrition-calc` secret the internal
reveal-metrics endpoint verifies incoming calls against -- NOT the
generic `internal-reveal-credential` shape identity-service uses.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.fullnameOverride }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.fullnameOverride }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: PROFILE_SERVICE_DATABASE_URL
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentials }}
        property: database_url
    - secretKey: PROFILE_SERVICE_REVEAL_CREDENTIAL_NUTRITION_CALC
      remoteRef:
        key: {{ .Values.secretsManager.internalRevealCredentialNutritionCalc }}
        property: credential
