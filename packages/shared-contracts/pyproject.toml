[build-system]
# Pinned exactly (not just a floor): hatchling's version string is
# embedded in the built wheel's WHEEL metadata file ("Generator: hatchling
# X.Y.Z"), so an unpinned requirement can resolve a different hatchling
# version locally vs. in CI (whichever is latest on PyPI at build time),
# producing a different wheel hash for byte-identical source -- which
# breaks `uv sync --frozen`'s hash-pinned install of this wheel wherever
# it's built fresh each time (every consuming service's CI/Dockerfile).
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "shared-contracts"
version = "0.1.0"
description = "NutriApp cross-service event/data shape contracts, plus the shared JWT/JWKS verification helper (shared_contracts.auth) -- see ADR-0022."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "httpx>=0.27",
    "pybreaker>=1.2",
    "tenacity>=9.0",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "jsonschema>=4.23"]

[tool.pytest.ini_options]
pythonpath = ["python"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["python/shared_contracts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "C408"]
