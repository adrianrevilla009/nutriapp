# SonarCloud automatic-analysis configuration for this monorepo.
#
# Scoped issue exclusions below (sonar.issue.ignore.multicriteria) are for
# genuine false positives, each documented with why -- never a blanket
# suppression. Follows the same "document the exception" convention used
# elsewhere in this repo for pip-audit's --ignore-vuln and mypy's
# per-module overrides.

# githubactions:S8541 ("Python package manager scripts should not be
# executed during installation") fires on any `uv sync`/`pip install`
# invocation lacking --no-build, with no awareness of *what* it would
# build. diary-service, profile-service, and nutrition-calculation-service
# each depend on packages/shared-contracts as a local, non-editable path
# dependency (pyproject.toml's [tool.uv.sources]) -- our own first-party
# code in this same repo, not a third-party sdist -- and `uv sync` must
# build it from source every time (no wheel is published anywhere). Every
# invocation of `uv sync` in these three services' CI workflows is
# already --frozen (S8544's "lock to verified versions" concern is
# genuinely addressed); --no-build cannot be added without breaking the
# install outright (verified locally: `uv sync --frozen --no-build` fails
# with "can't be installed because it is marked as --no-build but has no
# binary distribution").
sonar.issue.ignore.multicriteria=e1,e2,e3

sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/diary-service-ci.yml

sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/profile-service-ci.yml

sonar.issue.ignore.multicriteria.e3.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/nutrition-calculation-service-ci.yml
