name: Helm lint and template
description: >-
  Install Helm, vendor the _lib dependency, lint, and render the chart --
  identical across every service's chart-validation job. Factored out
  here because this exact sequence is duplicated in every service's CI
  workflow.
inputs:
  chart-dir:
    description: Path to the chart directory (contains Chart.yaml)
    required: true
  release-name:
    description: Release name passed to `helm template`
    required: true
  values-files:
    description: Space-separated list of -f value file paths, relative to chart-dir
    default: "values-dev.yaml ci/synthetic-values.yaml"
runs:
  using: composite
  steps:
    - name: Install helm
      uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      with:
        version: "v3.16.2"
    - name: helm dependency update (vendors _lib)
      shell: bash
      working-directory: ${{ inputs.chart-dir }}
      run: helm dependency update .
    - name: helm lint (dev values + checked-in CI fixture)
      shell: bash
      working-directory: ${{ inputs.chart-dir }}
      run: |
        values_flags=""
        for f in ${{ inputs.values-files }}; do values_flags="$values_flags -f $f"; done
        helm lint . $values_flags
    - name: helm template (fails on any render error)
      shell: bash
      working-directory: ${{ inputs.chart-dir }}
      run: |
        values_flags=""
        for f in ${{ inputs.values-files }}; do values_flags="$values_flags -f $f"; done
        helm template ${{ inputs.release-name }} . $values_flags > /dev/null
