name: activity-service-ci

on:
  pull_request:
    paths:
      - "services/activity-service/**"
      - "packages/shared-contracts/**"
      - "infra/k8s/charts/activity-service/**"
      - "infra/k8s/charts/_lib/**"
      - ".github/workflows/activity-service-ci.yml"
      - ".github/actions/setup-python-uv/**"
      - ".github/actions/pip-audit-scan/**"
      - ".github/actions/helm-lint-and-template/**"
  push:
    branches: [main]
    paths:
      - "services/activity-service/**"
      - "packages/shared-contracts/**"
      - "infra/k8s/charts/activity-service/**"
      - "infra/k8s/charts/_lib/**"
      - ".github/workflows/activity-service-ci.yml"
      - ".github/actions/setup-python-uv/**"
      - ".github/actions/pip-audit-scan/**"
      - ".github/actions/helm-lint-and-template/**"

defaults:
  run:
    working-directory: services/activity-service

# Stage order per ci-cd-conventions SKILL.md: lint -> type-check ->
# secret-scan -> unit -> dep-vuln-scan -> integration -> contract ->
# coverage-gate -> build-image -> image-scan -> push -> deploy-dev ->
# smoke-e2e -> promote-staging -> manual-approval -> promote-prod. This
# workflow covers lint through coverage-gate + build/scan; deploy stages
# are devops-agent/CI infra follow-up, same as every other service's
# workflow.
#
# ./.github/actions/setup-python-uv builds packages/shared-contracts into
# a wheel and syncs this service's deps from it (uv sync --no-build) for
# every job below that needs Python -- pyproject.toml's [tool.uv.sources]
# points at that exact wheel path, not the source directory, which is
# what lets --no-build succeed. The wheel itself is never checked in
# (dist/ is gitignored) -- rebuilt fresh in every job.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: services/activity-service
      - name: Ruff lint
        run: uv run --no-sync --no-build ruff check .
      - name: Ruff format check
        run: uv run --no-sync --no-build ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: services/activity-service
      - name: mypy
        run: uv run --no-sync --no-build mypy domain application infrastructure

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: services/activity-service
      - name: Unit tests (domain + application, no I/O)
        run: uv run --no-sync --no-build pytest tests/unit -q

  dep-vuln-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: services/activity-service
      - uses: ./.github/actions/pip-audit-scan
        with:
          working-directory: services/activity-service

  integration-and-contract-tests:
    runs-on: ubuntu-latest
    needs: dep-vuln-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: services/activity-service
      # testcontainers pulls Postgres/RabbitMQ images at runtime -- the
      # ubuntu-latest runner ships Docker already.
      - name: Integration tests (testcontainers, real Postgres/RabbitMQ)
        run: uv run --no-sync --no-build pytest tests/integration -q
      - name: Contract tests (HTTP + event schemas)
        run: uv run --no-sync --no-build pytest tests/contract -q

  coverage-gate:
    runs-on: ubuntu-latest
    needs: integration-and-contract-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: services/activity-service
      # Per-layer thresholds (CLAUDE.md section 3): domain >= 90%,
      # application >= 85%, infrastructure >= 70%.
      - name: Full suite (collects coverage for all three layers)
        run: |
          uv run --no-sync --no-build pytest tests/unit tests/contract tests/integration \
            --cov=domain --cov=application --cov=infrastructure \
            --cov-report=term-missing
      - name: Enforce domain coverage >= 90% (hard floor)
        run: uv run --no-sync --no-build coverage report --include="domain/*" --fail-under=90
      - name: Enforce application coverage >= 85%
        run: uv run --no-sync --no-build coverage report --include="application/*" --fail-under=85
      - name: Enforce infrastructure coverage >= 70%
        run: uv run --no-sync --no-build coverage report --include="infrastructure/*" --fail-under=70

  build-and-scan-image:
    runs-on: ubuntu-latest
    needs: coverage-gate
    # Overrides the workflow-level default working-directory: the build
    # context must be the repo root, not services/activity-service, since
    # this service depends on packages/shared-contracts as a local path
    # dependency -- see services/activity-service/Dockerfile's own
    # comment.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -f services/activity-service/Dockerfile -t activity-service:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: activity-service:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: "true"

  helm-lint-and-template:
    # Not part of the lint->...->coverage-gate->build chain above (this
    # validates infra/k8s/charts/, not services/activity-service/'s own
    # code) -- runs independently so a chart-only change doesn't need to
    # wait on/duplicate the Python stages, same as every other service's
    # workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/helm-lint-and-template
        with:
          chart-dir: infra/k8s/charts/activity-service
          release-name: activity-service

  # push / deploy-dev / smoke-e2e / promote-staging / manual-approval /
  # promote-prod: follow-up once infra/terraform's platform-infra plan is
  # applied and an ECR repo + EKS cluster exist (docs/ci-cd-strategy.md).
