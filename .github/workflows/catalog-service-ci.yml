name: catalog-service-ci

on:
  pull_request:
    paths:
      - "services/catalog-service/**"
      - "packages/shared-contracts/**"
      - "infra/k8s/charts/catalog-service/**"
      - "infra/k8s/charts/_lib/**"
      - ".github/workflows/catalog-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/catalog-service/**"
      - "packages/shared-contracts/**"
      - "infra/k8s/charts/catalog-service/**"
      - "infra/k8s/charts/_lib/**"
      - ".github/workflows/catalog-service-ci.yml"

defaults:
  run:
    working-directory: services/catalog-service

# Stage order per ci-cd-conventions SKILL.md: lint -> type-check ->
# secret-scan -> unit -> dep-vuln-scan -> integration -> contract ->
# coverage-gate -> build-image -> image-scan -> push -> deploy-dev ->
# smoke-e2e -> promote-staging -> manual-approval -> promote-prod.
# This workflow covers lint through coverage-gate + build/scan; deploy
# stages are devops-agent/CI infra follow-up, same as identity-service-ci.yml.
#
# No dedicated fixture-freshness/cassette-refresh step is added here —
# the hand-authored fixtures under tests/fixtures/ (Open Food Facts
# export sample, USDA FDC cassette-style response bodies) are reviewed
# like code, never auto-refreshed in CI, to avoid a CI job silently
# making a live third-party call (external-data-ethics SKILL.md).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: mypy
        run: uv run mypy domain application infrastructure

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Unit tests (domain + application, no I/O)
        run: uv run pytest tests/unit -q

  dep-vuln-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: pip-audit
        run: |
          # Exclude local monorepo path-dependencies (e.g. shared-contracts) --
          # they're not published to PyPI, so pip-audit's strict mode errors
          # out entirely ("Dependency not found on PyPI") rather than just
          # skipping them, which used to abort the scan before it audited
          # anything else in this file's real third-party dependencies.
          uv pip compile pyproject.toml | grep -v 'packages/shared-contracts$' > /tmp/requirements-audit.txt
          # PYSEC-2026-3447 (setuptools <83.0.0): a MANIFEST.in exclude-pattern
          # Unicode-normalization bypass affecting building a source distribution
          # on macOS APFS/HFS+ -- inapplicable here (this is a Linux runtime
          # dependency pulled in only so purgatory-circuitbreaker's import-time
          # `import pkg_resources` succeeds; this service never builds an sdist).
          # Upgrading past setuptools 81 breaks that import outright (pkg_resources
          # was removed in 81) -- see pyproject.toml's setuptools constraint comment.
          uvx pip-audit --strict --ignore-vuln PYSEC-2026-3447 -r /tmp/requirements-audit.txt

  integration-and-contract-tests:
    runs-on: ubuntu-latest
    needs: dep-vuln-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --extra dev
      # testcontainers pulls Postgres/Redis/RabbitMQ images at runtime —
      # the ubuntu-latest runner ships Docker already. The two source
      # adapters' tests never make a live HTTP call (see file header).
      - name: Integration tests (testcontainers + hand-authored fixtures, never live)
        run: uv run pytest tests/integration -q
      - name: Contract tests (HTTP + event schemas)
        run: uv run pytest tests/contract -q

  coverage-gate:
    runs-on: ubuntu-latest
    needs: integration-and-contract-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --extra dev
      # Per-layer thresholds (CLAUDE.md §3): domain >= 90%, application
      # >= 85%, infrastructure >= 70%.
      - name: Full suite (collects coverage for all three layers)
        run: |
          uv run pytest tests/unit tests/contract tests/integration \
            --cov=domain --cov=application --cov=infrastructure \
            --cov-report=term-missing
      - name: Enforce domain coverage >= 90%
        run: uv run coverage report --include="domain/*" --fail-under=90
      - name: Enforce application coverage >= 85%
        run: uv run coverage report --include="application/*" --fail-under=85
      - name: Enforce infrastructure coverage >= 70%
        run: uv run coverage report --include="infrastructure/*" --fail-under=70

  build-and-scan-image:
    runs-on: ubuntu-latest
    needs: coverage-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -t catalog-service:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # 0.24.0
        with:
          image-ref: catalog-service:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  helm-lint-and-template:
    # Not part of the lint->...->coverage-gate->build chain above (this
    # validates infra/k8s/charts/, not services/catalog-service/'s own
    # code) — runs independently so a chart-only change doesn't need to
    # wait on/duplicate the Python stages, same as identity-service-ci.yml.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/k8s/charts/catalog-service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: "v3.16.2"
      - name: helm dependency update (vendors _lib)
        run: helm dependency update .
      - name: helm lint (dev values + checked-in CI fixture)
        run: helm lint . -f values-dev.yaml -f ci/synthetic-values.yaml
      - name: helm template (fails on any render error)
        run: helm template catalog-service . -f values-dev.yaml -f ci/synthetic-values.yaml > /dev/null

  # push / deploy-dev / smoke-e2e / promote-staging / manual-approval /
  # promote-prod: follow-up once infra/terraform's platform-infra plan is
  # applied and an ECR repo + EKS cluster exist (docs/ci-cd-strategy.md).
