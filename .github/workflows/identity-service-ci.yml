name: identity-service-ci

on:
  pull_request:
    paths:
      - "services/identity-service/**"
      - "packages/shared-contracts/**"
      - "infra/k8s/charts/identity-service/**"
      - "infra/k8s/charts/_lib/**"
      - ".github/workflows/identity-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/identity-service/**"
      - "packages/shared-contracts/**"
      - "infra/k8s/charts/identity-service/**"
      - "infra/k8s/charts/_lib/**"
      - ".github/workflows/identity-service-ci.yml"

defaults:
  run:
    working-directory: services/identity-service

# Stage order per ci-cd-conventions SKILL.md: lint -> type-check ->
# secret-scan -> unit -> dep-vuln-scan -> integration -> contract ->
# coverage-gate -> build-image -> image-scan -> push -> deploy-dev ->
# smoke-e2e -> promote-staging -> manual-approval -> promote-prod.
# This workflow covers lint through coverage-gate + build/scan; deploy
# stages are devops-agent/CI infra follow-up once an EKS cluster exists
# (platform-infra plan).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-build
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-build
      - name: mypy
        run: uv run mypy domain application infrastructure

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-build
      - name: Unit tests (domain + application, no I/O)
        run: uv run pytest tests/unit -q

  dep-vuln-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-build
      - name: pip-audit
        run: |
          # Exclude local monorepo path-dependencies (e.g. shared-contracts) --
          # they're not published to PyPI, so pip-audit's strict mode errors
          # out entirely ("Dependency not found on PyPI") rather than just
          # skipping them, which used to abort the scan before it audited
          # anything else in this file's real third-party dependencies.
          uv pip compile pyproject.toml --no-build | grep -v 'packages/shared-contracts$' > /tmp/requirements-audit.txt
          uvx --no-build pip-audit==2.10.1 --strict -r /tmp/requirements-audit.txt

  integration-and-contract-tests:
    runs-on: ubuntu-latest
    needs: dep-vuln-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-build
      # testcontainers pulls Postgres/Redis/RabbitMQ images at runtime —
      # the ubuntu-latest runner ships Docker already.
      - name: Integration tests (testcontainers)
        run: uv run pytest tests/integration -q
      - name: Contract tests (HTTP + event schemas)
        run: uv run pytest tests/contract -q

  coverage-gate:
    runs-on: ubuntu-latest
    needs: integration-and-contract-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-build
      # Per-layer thresholds (CLAUDE.md §3): domain >= 90%, application
      # >= 85%, infrastructure >= 70%. One full-suite run collects a
      # single .coverage data file; `coverage report --include=<layer>/*`
      # is then run three times against that same data to gate each layer
      # independently — cheaper than re-running the suite per layer, and
      # avoids undercounting domain/application ports that are only
      # exercised indirectly via infrastructure-layer imports when a
      # narrower test selection is used.
      - name: Full suite (collects coverage for all three layers)
        run: |
          uv run pytest tests/unit tests/contract tests/integration \
            --cov=domain --cov=application --cov=infrastructure \
            --cov-report=term-missing
      - name: Enforce domain coverage >= 90%
        run: uv run coverage report --include="domain/*" --fail-under=90
      - name: Enforce application coverage >= 85%
        run: uv run coverage report --include="application/*" --fail-under=85
      - name: Enforce infrastructure coverage >= 70%
        run: uv run coverage report --include="infrastructure/*" --fail-under=70

  build-and-scan-image:
    runs-on: ubuntu-latest
    needs: coverage-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -t identity-service:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: identity-service:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: "true"
      - name: Smoke test image starts and passes /health/live
        run: |
          set -euo pipefail
          docker network create smoke-net
          # Same RabbitMQ-blocks-startup rationale as every other service's
          # build-and-scan-image job (see composition_root.py's
          # Container.startup()) -- see e.g. diary-service-ci.yml's
          # identical step for the full explanation.
          # --restart on-failure:5: the official image occasionally fails
          # its very first boot on a fresh anonymous volume with an
          # .erlang.cookie permission race (observed locally) -- a
          # transient RabbitMQ-image quirk unrelated to what this step
          # verifies, so it self-heals rather than flaking the whole job.
          docker run -d --name smoke-rabbitmq --network smoke-net --restart on-failure:5 rabbitmq:3.13-management-alpine
          # `rabbitmq-diagnostics ping` only proves the Erlang node is
          # alive -- it succeeds well before the AMQP listener on 5672 is
          # actually bound (confirmed locally: a service container
          # connecting right after a bare `ping` success still hit
          # ECONNREFUSED). `check_port_connectivity` is the check that
          # actually proves 5672 is accepting connections.
          for i in $(seq 1 40); do
            docker exec smoke-rabbitmq rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1 && break
            if [ "$i" -eq 40 ]; then
              echo "::error::RabbitMQ sidecar never became ready"
              docker logs smoke-rabbitmq
              exit 1
            fi
            sleep 2
          done
          # identity-service also requires a readable RS256 keypair
          # (ADR-0022) -- IDENTITY_JWT_PRIVATE_KEY_PATH/
          # IDENTITY_JWT_PUBLIC_KEY_PATH are both required with no default
          # (composition_root.py's Settings.from_env) -- same keypair shape
          # as `make dev-keys` generates for local docker compose, never a
          # real/committed key.
          mkdir -p "$RUNNER_TEMP/smoke-dev-keys"
          openssl genrsa -out "$RUNNER_TEMP/smoke-dev-keys/identity_jwt_private_key.pem" 2048
          openssl rsa -in "$RUNNER_TEMP/smoke-dev-keys/identity_jwt_private_key.pem" \
            -pubout -out "$RUNNER_TEMP/smoke-dev-keys/identity_jwt_public_key.pem"
          # openssl's default umask leaves the private key at 600, owned by
          # the runner's own user -- unreadable by the container's non-root
          # `app` user (uid 1000, Dockerfile's `useradd --uid 1000`) once
          # bind-mounted, since the uid doesn't match. Confirmed on a real
          # GitHub-hosted runner: PermissionError: [Errno 13] Permission
          # denied reading /run/secrets/identity_jwt_private_key.pem.
          # world-readable is fine -- this is a throwaway keypair generated
          # fresh per CI run, discarded with $RUNNER_TEMP, never a real
          # secret.
          chmod 644 "$RUNNER_TEMP/smoke-dev-keys/identity_jwt_private_key.pem" \
            "$RUNNER_TEMP/smoke-dev-keys/identity_jwt_public_key.pem"
          docker run -d --name smoke-app --network smoke-net -p 8000:8000 \
            -v "$RUNNER_TEMP/smoke-dev-keys:/run/secrets:ro" \
            -e IDENTITY_SERVICE_DATABASE_URL="postgresql+asyncpg://smoketest:smoketest@smoke-db-unused:5432/smoketest" \
            -e IDENTITY_SERVICE_RABBITMQ_URL="amqp://guest:guest@smoke-rabbitmq:5672/" \
            -e IDENTITY_JWT_PRIVATE_KEY_PATH="/run/secrets/identity_jwt_private_key.pem" \
            -e IDENTITY_JWT_PUBLIC_KEY_PATH="/run/secrets/identity_jwt_public_key.pem" \
            -e IDENTITY_INTERNAL_REVEAL_CREDENTIAL="smoke-test-credential" \
            identity-service:${{ github.sha }}
          READY=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/live > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ -z "$READY" ]; then
            echo "::error::identity-service did not pass /health/live after container start"
            docker logs smoke-app
            exit 1
          fi
          echo "identity-service /health/live OK"
      - name: Smoke test teardown
        if: always()
        run: |
          docker rm -f smoke-app smoke-rabbitmq 2>/dev/null || true
          docker network rm smoke-net 2>/dev/null || true

  helm-lint-and-template:
    # Not part of the lint->...->coverage-gate->build chain above (this
    # validates infra/k8s/charts/, not services/identity-service/'s own
    # code) — runs independently so a chart-only change doesn't need to
    # wait on/duplicate the Python stages. Flagged as a gap in
    # /test-review: previously only infra/k8s/charts/_lib was covered by
    # any CI gate (platform-infra plan §8); this service's own chart had
    # no automated lint/template check at all.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/k8s/charts/identity-service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: "v3.16.2"
      - name: helm dependency update (vendors _lib)
        run: helm dependency update .
      - name: helm lint (dev values + checked-in CI fixture)
        run: helm lint . -f values-dev.yaml -f ci/synthetic-values.yaml
      - name: helm template (fails on any render error)
        run: helm template identity-service . -f values-dev.yaml -f ci/synthetic-values.yaml > /dev/null

  # push / deploy-dev / smoke-e2e / promote-staging / manual-approval /
  # promote-prod: follow-up once infra/terraform's platform-infra plan is
  # applied and an ECR repo + EKS cluster exist (docs/ci-cd-strategy.md).
