# Root-level local dev stack (containerization SKILL.md: keep in parity
# with each chart's values-dev.yaml config keys). Wires up identity-service
# and profile-service and their dependencies — each service gets its own
# db block, never a shared schema (CLAUDE.md section 2.5: one database per
# service). `rabbitmq` is shared (a message broker, not a database).
name: nutriapp

services:
  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity_service}
      POSTGRES_USER: ${POSTGRES_USER:-identity_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identity_service}
    ports:
      - "5432:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-identity_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./.dev-keys/identity:/run/secrets:ro
    depends_on:
      identity-db:
        condition: service_healthy
      identity-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  profile-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PROFILE_POSTGRES_DB:-profile_service}
      POSTGRES_USER: ${PROFILE_POSTGRES_USER:-profile_service}
      POSTGRES_PASSWORD: ${PROFILE_POSTGRES_PASSWORD:-profile_service}
    ports:
      - "5433:5432"
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROFILE_POSTGRES_USER:-profile_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  profile-redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  profile-service:
    build:
      # Build context is the repo root (not services/profile-service)
      # because this service depends on packages/shared-contracts (the
      # shared_contracts.auth.jwt_verifier package, ADR-0022) as a local
      # path dependency -- the Dockerfile COPYs both.
      context: .
      dockerfile: services/profile-service/Dockerfile
    env_file:
      - .env
    environment:
      PROFILE_SERVICE_REDIS_URL: redis://profile-redis:6379/0
      # Local-dev-only placeholder -- production sets this from
      # Terraform's `cross_service_reveal_credential` secret
      # (implementation plan Addendum 2, requirement 1), never a literal
      # value in this file.
      PROFILE_SERVICE_REVEAL_CREDENTIAL_NUTRITION_CALC: ${PROFILE_SERVICE_REVEAL_CREDENTIAL_NUTRITION_CALC:-local-dev-only-placeholder}
    ports:
      - "8002:8000"
      # Internal-only reveal-metrics port (implementation plan Addendum 2,
      # requirement 3) -- exposed to the host for local dev only; in
      # cluster this is reachable exclusively from
      # nutrition-calculation-service's pods (NetworkPolicy), never Kong.
      - "8003:8001"
    # PROFILE_SERVICE_KMS_ENDPOINT_URL should point at a local KMS-compatible
    # emulator (e.g. LocalStack, added by whoever needs it locally — not
    # part of this stack yet) for local dev without real AWS credentials;
    # left unset here, matching the .env-driven convention identity-service
    # established (see README.md's "Running locally" section).
    depends_on:
      profile-db:
        condition: service_healthy
      profile-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  diary-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DIARY_POSTGRES_DB:-diary_service}
      POSTGRES_USER: ${DIARY_POSTGRES_USER:-diary_service}
      POSTGRES_PASSWORD: ${DIARY_POSTGRES_PASSWORD:-diary_service}
    ports:
      - "5434:5432"
    volumes:
      - diary-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIARY_POSTGRES_USER:-diary_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CATALOG_POSTGRES_DB:-catalog_service}
      POSTGRES_USER: ${CATALOG_POSTGRES_USER:-catalog_service}
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_PASSWORD:-catalog_service}
    ports:
      - "5435:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_POSTGRES_USER:-catalog_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Own Redis instance for local dev parity with the shared ElastiCache
  # cluster diary-service reuses in AWS via a `diary:*` key namespace
  # (implementation plan section 7/terraform footprint) -- a dedicated
  # local container is simpler than replicating key-namespacing locally.
  diary-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated per-service container for local dev parity only — in
  # Terraform/prod this reuses the single shared ElastiCache cluster the
  # platform-infra plan provisions, isolated purely by a `catalog:*` Redis
  # key namespace (implementation plan Addendum 1, section 9.7). No new
  # ElastiCache cluster is provisioned.
  catalog-redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  diary-service:
    build:
      # Build context is the repo root (not services/diary-service)
      # because this service depends on packages/shared-contracts (the
      # shared_contracts.auth.jwt_verifier package, ADR-0022) as a local
      # path dependency -- the Dockerfile COPYs both.
      context: .
      dockerfile: services/diary-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8003:8000"
    environment:
      DIARY_SERVICE_REDIS_URL: redis://diary-redis:6379/0
    depends_on:
      diary-db:
        condition: service_healthy
      diary-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8004:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nutrition-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NUTRITION_POSTGRES_DB:-nutrition_calculation_service}
      POSTGRES_USER: ${NUTRITION_POSTGRES_USER:-nutrition_calculation_service}
      POSTGRES_PASSWORD: ${NUTRITION_POSTGRES_PASSWORD:-nutrition_calculation_service}
    ports:
      - "5436:5432"
    volumes:
      - nutrition-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NUTRITION_POSTGRES_USER:-nutrition_calculation_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated per-service container for local dev parity only — in
  # Terraform/prod this reuses the single shared ElastiCache cluster the
  # platform-infra plan provisions, isolated purely by a `nutrition:*`
  # Redis key namespace (implementation plan section 7). No new
  # ElastiCache cluster is provisioned.
  nutrition-redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nutrition-calculation-service:
    build:
      # Build context is the repo root (not services/nutrition-calculation-service)
      # because this service depends on packages/shared-contracts (the
      # shared_contracts.auth.jwt_verifier package, ADR-0022) as a local
      # path dependency -- the Dockerfile COPYs both.
      context: .
      dockerfile: services/nutrition-calculation-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8005:8000"
    environment:
      # DATABASE_URL deliberately NOT hardcoded here (unlike an earlier
      # draft of this file) -- it comes from .env via env_file above, same
      # convention as every other service, so no credential (even a
      # dev-only default) is duplicated as a literal in this tracked file.
      NUTRITION_CALCULATION_SERVICE_REDIS_URL: redis://nutrition-redis:6379/0
      NUTRITION_CALCULATION_SERVICE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NUTRITION_CALCULATION_SERVICE_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      # Points at profile-service's container-internal port (8000, same
      # container port every service listens on) -- NOT its host-mapped
      # 8002, and there is deliberately no public route to it (implementation
      # plan Addendum 1, security sub-addendum requirement 3). The reveal
      # endpoint itself is built in profile-service's own coordinated
      # sub-plan; calling it locally requires that endpoint to actually
      # exist on the profile-service image in use.
      NUTRITION_CALCULATION_SERVICE_PROFILE_SERVICE_BASE_URL: http://profile-service:8000
      # Per-caller credential (implementation plan Addendum 1, security
      # sub-addendum requirement 1) -- local dev only, production value
      # comes from Secrets Manager (infra/terraform/environments/dev/nutrition-calculation-service.tf).
      NUTRITION_CALCULATION_SERVICE_PROFILE_REVEAL_CREDENTIAL: dev-profile-reveal-credential-change-me
    depends_on:
      nutrition-db:
        condition: service_healthy
      nutrition-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  food-recognition-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${FOOD_RECOGNITION_POSTGRES_DB:-food_recognition_service}
      POSTGRES_USER: ${FOOD_RECOGNITION_POSTGRES_USER:-food_recognition_service}
      POSTGRES_PASSWORD: ${FOOD_RECOGNITION_POSTGRES_PASSWORD:-food_recognition_service}
    ports:
      - "5437:5432"
    volumes:
      - food-recognition-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FOOD_RECOGNITION_POSTGRES_USER:-food_recognition_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  food-recognition-service:
    build:
      # Build context is the repo root (not services/food-recognition-service)
      # because this service depends on packages/shared-contracts (the
      # shared_contracts.auth.jwt_verifier package, ADR-0022) as a local
      # path dependency -- the Dockerfile COPYs both.
      context: .
      dockerfile: services/food-recognition-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8006:8000"
    environment:
      # DATABASE_URL deliberately NOT hardcoded here -- comes from .env
      # via env_file above, same convention as every other service.
      FOOD_RECOGNITION_SERVICE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      FOOD_RECOGNITION_SERVICE_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      FOOD_RECOGNITION_SERVICE_CATALOG_SERVICE_BASE_URL: http://catalog-service:8000
      # Per-caller credential for catalog-service's internal lookup
      # endpoint (implementation plan section 6(c)) -- local dev only,
      # production value comes from Secrets Manager.
      FOOD_RECOGNITION_SERVICE_CATALOG_LOOKUP_CREDENTIAL: dev-catalog-lookup-credential-change-me
      # Product-facing feature knobs (implementation plan section 1
      # acceptance criterion 2, section 8.3 acceptance criterion 9).
      FOOD_RECOGNITION_CONFIDENCE_THRESHOLD: "0.6"
      FOOD_RECOGNITION_PHOTO_ANALYSIS_ENABLED: "true"
    depends_on:
      food-recognition-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-notification_service}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-notification_service}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-notification_service}
    ports:
      - "5438:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_POSTGRES_USER:-notification_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      # Build context is the repo root (not services/notification-service)
      # because this service depends on packages/shared-contracts (the
      # shared_contracts.auth.jwt_verifier package, ADR-0022) as a local
      # path dependency -- the Dockerfile COPYs both.
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8007:8000"
    environment:
      # DATABASE_URL deliberately NOT hardcoded here -- comes from .env
      # via env_file above, same convention as every other service.
      NOTIFICATION_SERVICE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NOTIFICATION_SERVICE_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      NOTIFICATION_SERVICE_IDENTITY_SERVICE_BASE_URL: http://identity-service:8000
      # Read access to identity-service's single, shared internal-reveal
      # credential (composition_root.py's Settings docstring) -- local
      # dev only, production value comes from Secrets Manager.
      NOTIFICATION_SERVICE_IDENTITY_REVEAL_CREDENTIAL: dev-identity-reveal-credential-change-me
      # SES sandbox / local fake endpoints (docs/notifications.md section
      # 5) -- never real SES/SNS in local dev, same as CI.
      NOTIFICATION_SERVICE_SES_BASE_URL: http://ses-fake:9001
      NOTIFICATION_SERVICE_SNS_BASE_URL: http://sns-fake:9002
      NOTIFICATION_SERVICE_SES_FROM_ADDRESS: no-reply@nutriapp.example
      NOTIFICATION_SERVICE_REMINDER_SCAN_INTERVAL_SECONDS: "60"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  bff-service:
    build:
      # Build context is the repo root (not services/bff-service) because
      # this service depends on packages/shared-contracts (the
      # shared_contracts.auth.jwt_verifier package, ADR-0022) as a local
      # path dependency -- the Dockerfile COPYs both.
      context: .
      dockerfile: services/bff-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8008:8000"
    environment:
      # No database, no message broker (implementation plan section 2)
      # -- unlike every other service's block above, there is no
      # `*-db`/`*-redis` container and no DATABASE_URL here.
      BFF_SERVICE_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      BFF_SERVICE_DIARY_SERVICE_BASE_URL: http://diary-service:8000
      BFF_SERVICE_NUTRITION_CALCULATION_SERVICE_BASE_URL: http://nutrition-calculation-service:8000

volumes:
  identity-db-data:
  profile-db-data:
  diary-db-data:
  catalog-db-data:
  nutrition-db-data:
  food-recognition-db-data:
  notification-db-data:
